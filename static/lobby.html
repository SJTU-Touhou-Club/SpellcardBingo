<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spellcard Bingo | Lobby</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f5f5f5;
      background-image: url('media/warabe-asobi.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .card {
      background: rgba(255, 255, 255, 0.8);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      width: min(400px, 92vw);
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    h1 { margin: 0 0 20px; font-size: 22px; }
    .row { display: flex; gap: 10px; margin: 14px 0; align-items: center; }
    .row label { min-width: 80px; font-weight: 700; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .settings-block { width: 100%; margin: 10px 0 6px; align-self: stretch; }
    .setting-row {
      display: grid;
      grid-template-columns: 44px 1fr;
      column-gap: 8px;
      align-items: baseline;
      margin: 6px 0;
    }
    .setting-label {
      font-size: 11px;
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.2;
      padding-top: 2px;
    }
    .setting-buttons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .seg-btn {
      padding: 4px 11px;
      border-radius: 999px;
      border: 1px solid #666;
      font-size: 12px;
      font-weight: 600;
      background: #fff;
      cursor: pointer;
      transition: 0.15s;
      line-height: 1.2;
    }
    .seg-btn:hover { border-color: #333; background: #f7f7f7; }
    .seg-btn.selected { background: #333; color: #fff; border-color: #333; }
    .team-row { display: flex; gap: 12px; align-items: center; margin: 14px 0; }
    .team-row label { margin-right: 8px; font-weight: 700; }
    .team-btn {
      padding: 10px 20px;
      border-radius: 999px;
      border: 2px solid #ddd;
      font-size: 14px;
      font-weight: 700;
      background: #fff;
      cursor: pointer;
      transition: 0.15s;
    }
    .team-btn:hover { border-color: #bbb; background: #f9f9f9; }
    .team-btn.red { border-color: #EE5755; color: #EE5755; }
    .team-btn.red:hover, .team-btn.red.selected { background: #EE5755; color: #fff; }
    .team-btn.blue { border-color: #5557EE; color: #5557EE; }
    .team-btn.blue:hover, .team-btn.blue.selected { background: #5557EE; color: #fff; }
    .team-btn.observer { border-color: #666; color: #444; }
    .team-btn.observer:hover, .team-btn.observer.selected { background: #666; color: #fff; }
    .btn { padding: 10px 20px; border-radius: 10px; border: 2px solid #ddd; background: #fff; cursor: pointer; font-weight: 700; }
    .btn:hover { background: #f0f0f0; border-color: #bbb; }
    .primary { color: #fff; margin-top: 8px; transition: background 0.15s, border-color 0.15s; }
    .primary.team-red { background: #EE5755; border-color: #EE5755; }
    .primary.team-red:hover { background: #dd4644; border-color: #dd4644; }
    .primary.team-blue { background: #5557EE; border-color: #5557EE; }
    .primary.team-blue:hover { background: #4445dd; border-color: #4445dd; }
    .game-info { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 20px; }
    .game-info .badge { padding: 4px 10px; border-radius: 999px; background: rgba(30, 45, 90, 0.92); color: #e8ecf8; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    .game-info .size-tag { padding: 4px 10px; border-radius: 999px; background: rgba(30, 45, 90, 0.92); color: #e8ecf8; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Spellcard Bingo | Lobby</h1>
    <div id="game-info" class="game-info"></div>
    <div class="row">
      <label for="room">Room ID</label>
      <input id="room" type="text" placeholder="e.g. abc123" />
    </div>
    <div class="settings-block">
      <div class="setting-row">
        <span class="setting-label">Mode</span>
        <div class="setting-buttons">
          <button id="mode-shared" class="seg-btn selected" type="button">Shared</button>
          <button id="mode-exclusive" class="seg-btn" type="button">Exclusive</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Pool</span>
        <div class="setting-buttons">
          <button id="pool-normal" class="seg-btn selected" type="button">Normal</button>
          <button id="pool-lunatic" class="seg-btn" type="button">Lunatic</button>
        </div>
      </div>
    </div>
    <div class="team-row">
      <label>Team</label>
      <button id="team-red" class="team-btn red" type="button">RED</button>
      <button id="team-blue" class="team-btn blue selected" type="button">BLUE</button>
      <button id="team-observer" class="team-btn observer" type="button">Observer</button>
    </div>
    <div style="display: flex; justify-content: flex-end;">
      <button id="go" class="btn primary team-blue">Join</button>
    </div>
  </div>
  <script>
    const roomInput = document.getElementById('room');
    const goBtn = document.getElementById('go');
    const teamRedBtn = document.getElementById('team-red');
    const teamBlueBtn = document.getElementById('team-blue');
    const teamObserverBtn = document.getElementById('team-observer');
    const modeSharedBtn = document.getElementById('mode-shared');
    const modeExclusiveBtn = document.getElementById('mode-exclusive');
    const poolNormalBtn = document.getElementById('pool-normal');
    const poolLunaticBtn = document.getElementById('pool-lunatic');

    let selectedTeam = 'blue';
    let selectedMode = 'shared';
    let selectedPool = 'normal';

    function updatePlayButton() {
      goBtn.classList.remove('team-red', 'team-blue');
      if (selectedTeam === 'red') {
        goBtn.classList.add('team-red');
      } else if (selectedTeam === 'blue') {
        goBtn.classList.add('team-blue');
      }
      goBtn.textContent = selectedTeam === 'observer' ? 'Observe' : 'Join';
    }

    function updateTeamButtons() {
      teamRedBtn.classList.toggle('selected', selectedTeam === 'red');
      teamBlueBtn.classList.toggle('selected', selectedTeam === 'blue');
      teamObserverBtn.classList.toggle('selected', selectedTeam === 'observer');
    }

    teamRedBtn.addEventListener('click', () => {
      selectedTeam = 'red';
      updateTeamButtons();
      updatePlayButton();
    });
    teamBlueBtn.addEventListener('click', () => {
      selectedTeam = 'blue';
      updateTeamButtons();
      updatePlayButton();
    });
    teamObserverBtn.addEventListener('click', () => {
      selectedTeam = 'observer';
      updateTeamButtons();
      updatePlayButton();
    });

    function updateModeButtons() {
      modeSharedBtn.classList.toggle('selected', selectedMode === 'shared');
      modeExclusiveBtn.classList.toggle('selected', selectedMode === 'exclusive');
    }

    modeSharedBtn.addEventListener('click', () => {
      selectedMode = 'shared';
      updateModeButtons();
    });
    modeExclusiveBtn.addEventListener('click', () => {
      selectedMode = 'exclusive';
      updateModeButtons();
    });

    function updatePoolButtons() {
      poolNormalBtn.classList.toggle('selected', selectedPool === 'normal');
      poolLunaticBtn.classList.toggle('selected', selectedPool === 'lunatic');
    }

    poolNormalBtn.addEventListener('click', () => {
      selectedPool = 'normal';
      updatePoolButtons();
    });
    poolLunaticBtn.addEventListener('click', () => {
      selectedPool = 'lunatic';
      updatePoolButtons();
    });

    function post(url, body) {
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }).then(r => r.json());
    }

    goBtn.addEventListener('click', async () => {
      const room = (roomInput.value || '').trim();
      if (!room) {
        alert('Please enter a room ID.');
        return;
      }
      goBtn.disabled = true;
      const res = await post('/api/lobby/join', {
        room,
        team: selectedTeam,
        mode: selectedMode,
        pool: selectedPool,
      });
      if (res.incompatible) {
        goBtn.disabled = false;
        alert(res.message || 'This room was created with different settings. Please use a new Room ID.');
        return;
      }
      if (res.error) {
        goBtn.disabled = false;
        alert(res.error);
        return;
      }
      if (!res.ok) {
        goBtn.disabled = false;
        return;
      }
      window.location.href = `/?room=${encodeURIComponent(res.room)}&team=${encodeURIComponent(res.team)}`;
    });

    (async () => {
      try {
        const cfg = await fetch('/api/config').then(r => r.json());
        const mode = cfg.mode || 'shared';
        const size = cfg.size || 5;
        const pool = cfg.pool || 'normal';
        selectedMode = mode === 'exclusive' ? 'exclusive' : 'shared';
        selectedPool = pool === 'lunatic' ? 'lunatic' : 'normal';
        updateTeamButtons();
        updatePlayButton();
        updateModeButtons();
        updatePoolButtons();
        const el = document.getElementById('game-info');
        if (el) {
          el.innerHTML = `<span class="badge">Default: ${mode === 'exclusive' ? 'Exclusive' : 'Shared'} / ${selectedPool === 'lunatic' ? 'Lunatic' : 'Normal'}</span><span class="size-tag">${size}×${size} grid</span>`;
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
